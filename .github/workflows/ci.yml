name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 产品支持 Windows + macOS：Windows 侧是 taskkill / WMI / PowerShell，
    # macOS 侧是 SIGTERM→SIGKILL / ps / lsof / osascript；单测要在两个平台都跑。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ['22.x', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show runtime
        run: node --version; npm --version
      - name: Unit tests (no side effects, no host needed)
        run: npm test
      - name: Package manifest sanity
        shell: bash
        run: |
          # 插件包的关键声明：bundle patch 文件必须存在，其余是市场卡片/双语描述需要的资源。
          # （engines.dsh 与 SUPPORTED_RANGE 的一致性由 version.test.js 断言）
          # 用 node 解析 npm pack 的 JSON：Windows（Git Bash）与 macOS 共用同一份实现，不再用 pwsh 专属语法。
          npm pack --dry-run --json > pack.json 2>/dev/null
          node -e '
          const fs = require("node:fs");
          const raw = fs.readFileSync("pack.json", "utf8");
          // npm 偶尔在 JSON 前面打 warning，从第一个 [ 开始截
          const start = raw.indexOf("[");
          if (start < 0) { console.error("npm pack 输出里找不到 JSON"); process.exit(1); }
          const files = JSON.parse(raw.slice(start))[0].files.map((file) => file.path);
          const need = [
            "package.json",
            "cordis.patch.yml",
            "lib/index.js",
            "lib/client.js",
            "icon.svg",
            "locale/en.json",
            "locale/zh.json",
          ];
          const missing = need.filter((name) => !files.includes(name));
          if (missing.length) { console.error("tarball 缺少 " + missing.join(", ")); process.exit(1); }
          console.log("tarball files: " + files.length);
          '
          rm -f pack.json
